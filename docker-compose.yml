services:
  api:
    build: ./backend
    environment:
      CACHE_DIR: /data/cache
      # SPHEREx section reads averaged ~12 s/frame at 16 (latency-bound), so run more in parallel
      S3_MAX_CONCURRENCY: "32"
    volumes:
      - cache:/data/cache
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  cache:
